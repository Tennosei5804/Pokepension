# Compile l'installeur et publie la version.
#
# Se déclenche sur un tag « v0.2.0 » — jamais sur une simple pousse. Livrer est
# une décision, pas une conséquence de chaque commit :
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# Ce qui sort : l'installeur .exe, et le latest.json que l'application interroge
# au lancement. Ce dernier porte la signature du paquet ; sans la clé privée
# rangée dans les secrets du dépôt, il n'est pas produit et les mises à jour ne
# partent pas — l'action échoue plutôt que de publier un paquet que personne ne
# pourra vérifier.

name: Publier une version

on:
  push:
    tags: ["v*"]
  # Permet aussi de relancer à la main depuis l'onglet Actions, quand une
  # publication a échoué pour une raison qui n'a rien à voir avec le code.
  workflow_dispatch:

# Le jeton doit pouvoir créer la Release et y déposer les fichiers. Rien de plus.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # L'adresse de l'API est gravée dans le binaire à la compilation. Sans
      # elle, API_DEFAUT s'applique — http://127.0.0.1:8787 — et l'application
      # distribuée cherche l'API sur la machine de CHAQUE personne qui
      # l'installe. Elle se lance, elle s'ouvre, et rien ne fonctionne : ni la
      # connexion, ni les dex, ni le partage.
      #
      # Le défaut ne se voit pas ici, où l'API tourne vraiment en local. Il ne
      # se voit que chez les autres, après distribution. On arrête donc la
      # publication plutôt que de livrer un installeur inutilisable.
      #
      # POKEPENSION_API est une VARIABLE de dépôt, pas un secret : c'est une
      # adresse publique, et un secret dans un binaire distribué n'en est plus
      # un. Settings → Secrets and variables → Actions → onglet Variables.
      - name: Vérifier que l'adresse de l'API est définie
        shell: bash
        run: |
          if [ -z "${{ vars.POKEPENSION_API }}" ]; then
            echo "::error::La variable de dépôt POKEPENSION_API n'est pas définie."
            echo "::error::Sans elle, l'installeur pointerait vers 127.0.0.1 et"
            echo "::error::ne fonctionnerait chez personne d'autre que vous."
            echo "::error::À poser dans Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          echo "API visée : ${{ vars.POKEPENSION_API }}"

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      # Sans ce cache, chaque publication recompile l'arbre entier : une bonne
      # dizaine de minutes pour retrouver exactement ce qu'on avait déjà.
      - name: Réutiliser la compilation précédente
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      # ---- La signature du code ---------------------------------------------
      #
      # DEUX SIGNATURES SANS RAPPORT, ET LA CONFUSION COÛTE DU TEMPS.
      # TAURI_SIGNING_PRIVATE_KEY, plus bas, est une clé **minisign** : elle sert
      # à l'application pour vérifier que la mise à jour qu'elle télécharge vient
      # bien de nous. Windows et Chrome ne la voient jamais.
      # Celle-ci est une signature **Authenticode** : c'est la seule que Windows
      # regarde, et la seule qui puisse lever « Éditeur inconnu ».
      #
      # POURQUOI PAS DANS tauri.conf.json. Un signCommand écrit en dur dans la
      # configuration ferait échouer `tauri build` sur toute machine dépourvue de
      # l'outil de signature — la tienne d'abord. La surcharge est donc posée ici,
      # au moment de la compilation, et seulement si les secrets existent.
      #
      # SANS CERTIFICAT, RIEN NE CHANGE : on compile comme avant, non signé, avec
      # un avertissement dans le journal. La publication n'échoue pas pour ça —
      # elle échouerait si l'on croyait signer et qu'on ne signait pas, ce que
      # vérifie l'étape d'après.
      #
      # Comment obtenir un certificat et quoi mettre dans ces secrets :
      # app/outils/faux-positif/LISEZMOI.md
      - name: Préparer la signature du code
        id: signature
        # En PowerShell et non en bash : ConvertTo-Json échappe seul les
        # guillemets et les antislashs de la commande de signature. Les écrire à
        # la main, c'est en perdre un le jour où un chemin en contient — et cela
        # évite de dépendre de jq, qui n'est pas testable hors du runner.
        shell: pwsh
        # Les valeurs passent par l'environnement et non par ${{ }} dans le
        # script : une substitution directe collerait la variable dans le texte
        # du script, où un caractère malheureux devient de la commande.
        env:
          COMMANDE: ${{ vars.WINDOWS_SIGN_COMMAND }}
          INSTALLATION: ${{ vars.WINDOWS_SIGN_INSTALL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:COMMANDE)) {
            Add-Content $env:GITHUB_OUTPUT "signer=non"
            Add-Content $env:GITHUB_OUTPUT "args="
            Write-Output "::warning::Aucun certificat configuré : l'installeur partira NON SIGNÉ."
            Write-Output "::warning::SmartScreen affichera « Éditeur inconnu », et Defender peut le bloquer."
            Write-Output "::warning::Poser la variable WINDOWS_SIGN_COMMAND pour l'activer."
            Write-Output "::warning::Marche à suivre : app/outils/faux-positif/LISEZMOI.md"
            exit 0
          }

          if (-not [string]::IsNullOrWhiteSpace($env:INSTALLATION)) {
            Write-Output "Installation de l'outil de signature…"
            # Volontairement non filtrée : c'est une commande posée par le dépôt
            # lui-même, au même titre que le reste de ce fichier.
            Invoke-Expression $env:INSTALLATION
            if ($LASTEXITCODE -ne 0) {
              Write-Output "::error::L'installation de l'outil de signature a échoué."
              exit 1
            }
          }

          # Tauri remplace %1 par le chemin du fichier à signer.
          # WriteAllText avec un UTF8Encoding($false) plutôt que Set-Content :
          # une nomenclature en tête du JSON et le lecteur de Tauri s'arrête à la
          # première ligne, sans dire pourquoi.
          $json = @{ bundle = @{ windows = @{ signCommand = $env:COMMANDE } } } |
                  ConvertTo-Json -Depth 5
          # CHEMIN ABSOLU, et en barres obliques. L'action compile depuis app/,
          # pas depuis la racine : un chemin relatif dépendrait de qui appelle.
          # Les barres obliques passent sur Windows et évitent qu'un antislash
          # se fasse manger en traversant l'argument.
          $fichier = (Join-Path $PWD 'app/ci-signature.json') -replace '\\', '/'
          [IO.File]::WriteAllText($fichier, $json, (New-Object Text.UTF8Encoding($false)))
          Write-Output "Surcharge écrite dans $fichier :"
          Get-Content $fichier

          Add-Content $env:GITHUB_OUTPUT "signer=oui"
          Add-Content $env:GITHUB_OUTPUT "args=--config $fichier"

      # L'application n'a aucune chaîne JavaScript : les réserves sont
      # versionnées, le frontend est servi tel quel depuis app/src. Il n'y a donc
      # ni npm install ni étape de build avant celle-ci.
      - name: Compiler, signer et publier
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Lu par option_env! dans lib.rs, donc gravé dans le binaire.
          POKEPENSION_API: ${{ vars.POKEPENSION_API }}
          # Ce que l'outil de signature ira chercher tout seul dans son
          # environnement. Les noms sont ceux d'Azure Trusted Signing, la voie
          # recommandée ; pour un autre fournisseur, ajouter ses variables ICI —
          # un processus fils hérite de l'environnement, l'outil les trouvera.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          args: ${{ steps.signature.outputs.args }}
          projectPath: app
          tagName: v__VERSION__
          releaseName: PokéPension v__VERSION__
          releaseBody: |
            Installeur Windows ci-dessous — `PokéPension_x.y.z_x64-setup.exe`.

            Les versions déjà installées se mettront à jour toutes seules au
            prochain lancement : l'application propose, vous décidez.
          # La Release naît en brouillon : le temps de relire les notes et de
          # vérifier que l'installeur se lance avant de la rendre visible.
          # Les mises à jour automatiques ne partent qu'une fois publiée.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      # UNE SIGNATURE QUI ÉCHOUE NE FAIT PAS ÉCHOUER LA COMPILATION. Le bundler
      # signe après avoir bâti l'installeur ; selon l'outil, un jeton expiré ou
      # un profil mal nommé ressort en avertissement, et l'on publie un binaire
      # non signé en croyant l'avoir signé. C'est exactement le genre de vert
      # trompeur que ce fichier combat déjà pour les fichiers de la release.
      #
      # On regarde donc le fichier lui-même, et non le journal de l'outil.
      - name: Vérifier que l'installeur porte bien une signature
        shell: pwsh
        run: |
          $exe = Get-ChildItem app/src-tauri/target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $exe) {
            Write-Output "::error::Aucun installeur trouvé — la compilation n'a rien produit."
            exit 1
          }
          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Output "Installeur : $($exe.Name)"
          Write-Output "Signature  : $($sig.Status)"
          if ($sig.SignerCertificate) {
            Write-Output "Éditeur    : $($sig.SignerCertificate.Subject)"
            Write-Output "Expire le  : $($sig.SignerCertificate.NotAfter)"
          }

          if ('${{ steps.signature.outputs.signer }}' -ne 'oui') {
            Write-Output "::warning::Installeur NON SIGNÉ (aucun certificat configuré)."
            exit 0
          }
          if ($sig.Status -ne 'Valid') {
            Write-Output "::error::La signature était demandée mais l'installeur n'est pas signé valablement."
            Write-Output "::error::État : $($sig.Status). On refuse de publier un binaire qu'on croit signé."
            exit 1
          }
          Write-Output "Signature valide."

      # Une publication peut « réussir » en ne livrant rien. C'est arrivé à la
      # v0.1.0 : le workflow au vert, et une release sans le moindre fichier —
      # une release créée à la main sur le même tag avait pris la place de celle
      # que l'action préparait. Un tag ne porte qu'une release ; la seconde ne
      # remplace pas la première, elle l'empêche d'exister.
      #
      # Personne ne s'en aperçoit avant qu'un ami clique sur un lien mort. On
      # vérifie donc que les deux fichiers sont bien là, et on échoue sinon.
      - name: Vérifier que la release contient bien les deux fichiers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          fichiers=$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')
          echo "Fichiers de la release :"
          echo "${fichiers:-  (aucun)}"

          manque=0
          echo "$fichiers" | grep -qi '\.exe$'      || { echo "::error::L'installeur .exe manque."; manque=1; }
          echo "$fichiers" | grep -qi 'latest\.json' || { echo "::error::latest.json manque — aucune mise à jour ne partirait."; manque=1; }

          if [ "$manque" = "1" ]; then
            echo "::error::Une release existe peut-être déjà sur ce tag, créée à la main."
            echo "::error::Supprimez-la ainsi que le tag, puis reposez le tag."
            exit 1
          fi
          echo "Les deux fichiers sont présents."
