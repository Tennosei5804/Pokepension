# Compile l'installeur et publie la version.
#
# Se déclenche sur un tag « v0.2.0 » — jamais sur une simple pousse. Livrer est
# une décision, pas une conséquence de chaque commit :
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# Ce qui sort : l'installeur .exe, et le latest.json que l'application interroge
# au lancement. Ce dernier porte la signature du paquet ; sans la clé privée
# rangée dans les secrets du dépôt, il n'est pas produit et les mises à jour ne
# partent pas — l'action échoue plutôt que de publier un paquet que personne ne
# pourra vérifier.

name: Publier une version

on:
  push:
    tags: ["v*"]
  # Permet aussi de relancer à la main depuis l'onglet Actions, quand une
  # publication a échoué pour une raison qui n'a rien à voir avec le code.
  workflow_dispatch:

# Le jeton doit pouvoir créer la Release et y déposer les fichiers. Rien de plus.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # L'adresse de l'API est gravée dans le binaire à la compilation. Sans
      # elle, API_DEFAUT s'applique — http://127.0.0.1:8787 — et l'application
      # distribuée cherche l'API sur la machine de CHAQUE personne qui
      # l'installe. Elle se lance, elle s'ouvre, et rien ne fonctionne : ni la
      # connexion, ni les dex, ni le partage.
      #
      # Le défaut ne se voit pas ici, où l'API tourne vraiment en local. Il ne
      # se voit que chez les autres, après distribution. On arrête donc la
      # publication plutôt que de livrer un installeur inutilisable.
      #
      # POKEPENSION_API est une VARIABLE de dépôt, pas un secret : c'est une
      # adresse publique, et un secret dans un binaire distribué n'en est plus
      # un. Settings → Secrets and variables → Actions → onglet Variables.
      - name: Vérifier que l'adresse de l'API est définie
        shell: bash
        run: |
          if [ -z "${{ vars.POKEPENSION_API }}" ]; then
            echo "::error::La variable de dépôt POKEPENSION_API n'est pas définie."
            echo "::error::Sans elle, l'installeur pointerait vers 127.0.0.1 et"
            echo "::error::ne fonctionnerait chez personne d'autre que vous."
            echo "::error::À poser dans Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          echo "API visée : ${{ vars.POKEPENSION_API }}"

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      # Sans ce cache, chaque publication recompile l'arbre entier : une bonne
      # dizaine de minutes pour retrouver exactement ce qu'on avait déjà.
      - name: Réutiliser la compilation précédente
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      # L'application n'a aucune chaîne JavaScript : les réserves sont
      # versionnées, le frontend est servi tel quel depuis app/src. Il n'y a donc
      # ni npm install ni étape de build avant celle-ci.
      - name: Compiler, signer et publier
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Lu par option_env! dans lib.rs, donc gravé dans le binaire.
          POKEPENSION_API: ${{ vars.POKEPENSION_API }}
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: PokéPension v__VERSION__
          releaseBody: |
            Installeur Windows ci-dessous — `PokéPension_x.y.z_x64-setup.exe`.

            Les versions déjà installées se mettront à jour toutes seules au
            prochain lancement : l'application propose, vous décidez.
          # La Release naît en brouillon : le temps de relire les notes et de
          # vérifier que l'installeur se lance avant de la rendre visible.
          # Les mises à jour automatiques ne partent qu'une fois publiée.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      # Une publication peut « réussir » en ne livrant rien. C'est arrivé à la
      # v0.1.0 : le workflow au vert, et une release sans le moindre fichier —
      # une release créée à la main sur le même tag avait pris la place de celle
      # que l'action préparait. Un tag ne porte qu'une release ; la seconde ne
      # remplace pas la première, elle l'empêche d'exister.
      #
      # Personne ne s'en aperçoit avant qu'un ami clique sur un lien mort. On
      # vérifie donc que les deux fichiers sont bien là, et on échoue sinon.
      - name: Vérifier que la release contient bien les deux fichiers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          fichiers=$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')
          echo "Fichiers de la release :"
          echo "${fichiers:-  (aucun)}"

          manque=0
          echo "$fichiers" | grep -qi '\.exe$'      || { echo "::error::L'installeur .exe manque."; manque=1; }
          echo "$fichiers" | grep -qi 'latest\.json' || { echo "::error::latest.json manque — aucune mise à jour ne partirait."; manque=1; }

          if [ "$manque" = "1" ]; then
            echo "::error::Une release existe peut-être déjà sur ce tag, créée à la main."
            echo "::error::Supprimez-la ainsi que le tag, puis reposez le tag."
            exit 1
          fi
          echo "Les deux fichiers sont présents."
