[package]
name = "pokepension"
version = "0.42.1"
description = "PokéPension — suivi de collection Pokémon"
authors = ["Tennosei_"]
edition = "2021"

[lib]
name = "pokepension_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# La mise à jour. Le plugin va chercher un latest.json publié avec la Release
# GitHub, compare son numéro de version à celui d'ici, et n'installe que ce qui
# porte une signature faite avec notre clé privée — sans quoi n'importe qui
# pouvant intercepter le téléchargement pourrait livrer son propre installeur.
#
# « process » l'accompagne : après l'installation, il faut relancer, et c'est
# lui qui sait le faire proprement.
# La presence Discord : un tuyau local, aucune dependance native. Pure Rust,
# licence MIT. Si Discord n'est pas ouvert, le module se tait — voir presence.rs.
discord-rich-presence = "1"

tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"

# Les raccourcis globaux du compteur de chasse. « Globaux » est le point :
# la fenêtre de PokéPension n'est pas au premier plan pendant qu'on chasse,
# le jeu l'est. Un raccourci de fenêtre ne servirait que pendant les pauses.
#
# En dépendance ordinaire et non sous cfg(desktop) : c'est ainsi que le
# script de compilation de Tauri trouve les fichiers de permission du
# plugin — sous une table de cible, « global-shortcut:default » reste
# introuvable et la compilation s'arrête. Le plugin, lui, se garde tout
# seul sur mobile.
tauri-plugin-global-shortcut = "2"

# rustls plutôt que le TLS du système : un binaire distribuable qui ne dépend
# d'aucune bibliothèque installée sur la machine du joueur.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Le minuscule serveur qui reçoit le retour de connexion Discord.
tiny_http = "0.12"
opener = "0.7"

# L'échange PKCE : un vérifieur tiré au sort, son empreinte SHA-256 comme défi.
# Ces trois-là sont déjà dans l'arbre (rustls, reqwest) — les déclarer ne coûte
# aucune compilation supplémentaire.
sha2 = "0.10"
base64 = "0.21"
getrandom = "0.2"

[profile.release]
opt-level = "s"    # on optimise la taille : c'est un installeur qu'on distribue
lto = true
codegen-units = 1
strip = true

