<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Un Pokédex partagé — PokéPension</title>
<!-- Un lien de partage se colle dans un salon. Il ne doit pas finir dans un
     moteur de recherche : la collection de quelqu'un n'a rien à y faire. -->
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Un Pokédex partagé sur PokéPension.">

<!-- LA PAGE D'UN LIEN DE PARTAGE, DANS LE BOÎTIER DU POKÉDEX.
     Elle ne dessine pas sa propre identité : elle reprend celle de
     l'application — le boîtier rouge de base.css, l'écran d'accueil.css —
     et n'en garde que ce qu'un visiteur peut faire, c'est-à-dire regarder.
     Pas de navigation, pas de barre d'outils, rien à cocher. Le même objet,
     en plus simple.

     Elle se lit SANS COMPTE : un seul appel, GET /api/partage/<code>, la
     seule route du service ouverte sans jeton. Elle ne charge donc pas le
     pont, et n'ouvre aucune session.

     LA LISTE VIENT DE LA MÊME RÉSERVE QUE L'APPLICATION. donnees.js porte
     GAMES, donnees-embarquees.js les espèces et les Pokédex régionaux.
     Recopier ces listes ici en ferait une seconde vérité qui dériverait. -->
<link rel="stylesheet" href="/css/polices.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/accueil.css">
<link rel="stylesheet" href="/css/dex.css">
<!-- La politique du site : cibles tactiles a 44 px sous pointeur
     grossier, et les reglages telephone. Elle passe en dernier. -->
<link rel="stylesheet" href="/css/site.css">
<link rel="stylesheet" href="/css/partage-site.css">
</head>
<body>

<div class="dex">
  <div class="dex-header">
    <div class="dex-lens"></div>
    <div class="dex-titleblock">
      <span class="dex-eyebrow">Pok&eacute;dex partag&eacute;</span>
      <span class="dex-title">Pok&eacute;Pension</span>
    </div>
    <!-- Là où l'application met le badge de compte, on met celui qui partage :
         même place, même rôle — à qui appartient cet écran. -->
    <div class="pt-badge" id="ptBadge" hidden>
      <img id="ptAvatar" alt="">
      <span id="ptPseudo">&mdash;</span>
    </div>
    <div class="dex-lights"><span></span><span></span><span></span></div>
  </div>

  <div class="screen-frame">
    <div class="screen screen-boot">

      <section class="pt-attente" id="ptAttente">
        <p>Ouverture du Pok&eacute;dex partag&eacute;&hellip;</p>
      </section>

      <section class="pt-echec" id="ptEchec" hidden>
        <h1 class="pt-echec-titre" id="ptEchecTitre">Ce lien ne m&egrave;ne &agrave; rien</h1>
        <p class="pt-echec-mot" id="ptEchecMot"></p>
        <a class="toggle-btn" href="/">D&eacute;couvrir Pok&eacute;Pension</a>
      </section>

      <div id="ptContenu" hidden>

        <!-- L'en-tête de l'écran, dans la forme de l'accueil de
             l'application : une ligne de contexte, un titre, une phrase. -->
        <div class="home-hero">
          <div class="home-eyebrow" id="ptEyebrow">Pok&eacute;dex</div>
          <h2 class="home-title" id="ptTitre">&mdash;</h2>
          <p class="home-sub" id="ptPhrase"></p>
        </div>

        <img class="pt-logo" id="ptLogo" alt="" hidden>

        <!-- Les deux jauges de l'accueil, à l'identique : c'est la même
             information, et qui connaît l'application la relit sans
             réapprendre. -->
        <div class="home-gauges" id="ptJauges"></div>

        <div class="home-section-title" id="ptGrilleTitre">Le Pok&eacute;dex</div>
        <!-- CE QU'UN VISITEUR PEUT FAIRE, ET RIEN DE PLUS : ranger la
             grille, et ne garder que ce qui manque. Ce sont les deux menus
             du Pokédex de l'application, avec ses libellés — qui connaît
             l'un retrouve l'autre.

             DEUX ÉCARTS, ET LEURS RAISONS. « Tri : Rareté » demande
             /api/rarete, qui exige un jeton : un visiteur n'en a pas. Et le
             filtre de l'application compte huit entrées, dont l'obtention
             et la vue active — ici il n'y a ni vue active ni rien à cocher,
             donc trois lignes suffisent.

             DES <select> NUS, ET C'EST TOUT : menus.js les habille lui-même,
             comme partout ailleurs. Écrire un menu à la main ici en ferait
             un second à tenir d'accord avec le premier. -->
        <div class="pt-barre">
          <select id="ptTri" aria-label="Trier">
            <option value="jeu">Tri : N° du jeu</option>
            <option value="national">Tri : N° National</option>
            <option value="gen">Tri : Génération</option>
            <option value="nom">Tri : Alphabétique</option>
          </select>
          <select id="ptFiltre" aria-label="Filtrer">
            <option value="tout">Tout afficher</option>
            <option value="pris">Capturés</option>
            <option value="manque">Manquants</option>
          </select>
          <span class="pt-compte" id="ptGrilleCompte"></span>
        </div>
        <div class="pt-grille" id="ptGrille"></div>

        <p class="pt-fraicheur" id="ptFraicheur"></p>

        <div class="home-section-title">Et toi ?</div>
        <div class="home-actions">
          <a class="toggle-btn" href="/dex">&#128214; Ouvrir mon propre Pok&eacute;dex</a>
          <a class="toggle-btn" href="/telecharger">&#11015; T&eacute;l&eacute;charger l'application</a>
        </div>

      </div>
    </div>
  </div>

  <div class="pt-pied">
    <span>PROJET NON OFFICIEL. NON APPROUV&Eacute; PAR OU ASSOCI&Eacute; &Agrave; NINTENDO, GAME FREAK OU THE POK&Eacute;MON COMPANY.</span>
  </div>
</div>

<script src="/js/donnees.js"></script>
<script src="/js/donnees-embarquees.js"></script>
<script src="/js/partage-site.js"></script>
<!-- Il habille les deux <select> ci-dessus, comme dans
     l'application. Autonome : 188 lignes, aucune dépendance. -->
<script src="/js/menus.js"></script>
</body>
</html>
